<div class="container mt-5">

  <!-- ================= ADD PRODUCT ================= -->
  <div class="card shadow mb-5">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Add Product</h4>
    </div>

    <div class="card-body">
      <form [formGroup]="addProductForm" (ngSubmit)="addProduct()">

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">SKU</label>
            <input class="form-control"
                   formControlName="sku">
          </div>

          <div class="col-md-6">
            <label class="form-label">Title</label>
            <input class="form-control"
                   formControlName="title">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control"
                    rows="3"
                    formControlName="description"></textarea>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Price</label>
            <input type="number"
                   class="form-control"
                   formControlName="price">
          </div>

          <div class="col-md-4">
            <label class="form-label">Stock</label>
            <input type="number"
                   class="form-control"
                   formControlName="stock">
          </div>

          <div class="col-md-4">
            <label class="form-label">Status</label>
            <select class="form-select"
                    formControlName="status">

              @for (status of productStatuses; track status) {
              <option [ngValue]="status">
                {{ status }}
              </option>
              }

            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Categories (comma separated)</label>
          <input class="form-control"
                 formControlName="categories">
        </div>

        <button class="btn btn-primary w-100">
          Add Product
        </button>

      </form>
    </div>
  </div>


  <!-- ================= PRODUCT LIST ================= -->

  <h4 class="mb-3">My Products</h4>

  <div class="row">

    @for (product of products; track product.productId) {

    <div class="col-md-4 mb-4">

      <div class="card h-100 shadow-sm">

        <div class="card-body">

          <h5 class="card-title">
            {{ product.title }}
          </h5>

          <p class="text-muted small">
            {{ product.description }}
          </p>

          <p><strong>Price:</strong> ₹{{ product.price }}</p>
          <p><strong>Stock:</strong> {{ product.stock }}</p>

          <!-- ================= STATUS EDIT ================= -->
          <div class="mb-3">
            <label class="form-label fw-bold">Status</label>

            <select class="form-select form-select-sm"
                    [ngModel]="product.status"
                    (ngModelChange)="updateStatus(product, $event)">

              @for (status of productStatuses; track status) {
              <option [ngValue]="status">
                {{ status }}
              </option>
              }

            </select>
          </div>

          <!-- ================= DELETE PRODUCT ================= -->
          <button class="btn btn-danger btn-sm w-100 mb-3"
                  (click)="deleteProduct(product.productId)">
            Delete Product
          </button>

          <!-- ================= IMAGE UPLOAD ================= -->
          <input type="file"
                 class="form-control form-control-sm mb-2"
                 (change)="onFileSelected($event)">

          <button class="btn btn-success btn-sm w-100 mb-3"
                  (click)="addPhoto(product.productId)">
            Upload Image
          </button>

          <!-- ================= SHOW IMAGES ================= -->
          @if (product.images?.length > 0) {

          <div class="d-flex flex-wrap gap-2">

            @for (img of product.images; track img.imageId) {

            <div class="position-relative">

              <img [src]="img.url"
                   class="img-thumbnail"
                   style="width:100px;height:100px;object-fit:cover;">

              <button class="btn btn-sm btn-danger position-absolute top-0 end-0"
                      (click)="deleteImage(product.productId, img.imageId!)">
                ×
              </button>

            </div>

            }

          </div>

          }

        </div>
      </div>

    </div>

    }

  </div>

</div>
