spring.application.name=GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# PRODUCT SERVICE

spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PRODUCT
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/product/**


# AUTHENTICATION SERVICE

spring.cloud.gateway.server.webmvc.routes[1].id=auth-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://AUTHENTICATION
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/login,/user/**,/getUser,/editUser,/addAddress,/updateAddress/**,/deleteAddress/**


# ORDER SERVICE

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ORDER
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/order/**

# PAYMENT SERVICE

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PAYMENT
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/payment/**


