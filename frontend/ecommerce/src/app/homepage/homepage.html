<div class="container mt-4">

  <h2 class="text-center mb-4">All Products</h2>

  <div class="row">

    @for (p of product; track p.productId; let i = $index) {

    <div class="col-md-4 mb-4">

      <div class="card h-100 shadow-sm">

        <!-- IMAGE SECTION -->
        <div class="position-relative">

          @if (p.images && p.images.length > 0) {

          <div id="carousel{{i}}" class="carousel slide">

            <!-- Images -->
            <div class="carousel-inner">

              @for (img of p.images; track img; let j = $index) {

              <div
                class="carousel-item"
                [class.active]="j === 0">

                <img
                  [src]="img.url"
                  class="card-img-top"
                  style="height:250px; object-fit:cover;">
              </div>

              }

            </div>

            <!-- Previous Button -->
            @if (p.images.length > 1) {

            <button
              class="carousel-control-prev"
              type="button"
              [attr.data-bs-target]="'#carousel' + i"
              data-bs-slide="prev">

              <span class="bg-dark bg-opacity-75 rounded-circle d-flex justify-content-center align-items-center"
                    style="width:35px;height:35px;">
                <span class="carousel-control-prev-icon"></span>
              </span>

            </button>

            <!-- Next Button -->
            <button
              class="carousel-control-next"
              type="button"
              [attr.data-bs-target]="'#carousel' + i"
              data-bs-slide="next">

              <span class="bg-dark bg-opacity-75 rounded-circle d-flex justify-content-center align-items-center"
                    style="width:35px;height:35px;">
                <span class="carousel-control-next-icon"></span>
              </span>

            </button>

            }

          </div>

          } @else {

          <img
            src="https://via.placeholder.com/300"
            class="card-img-top"
            style="height:250px; object-fit:cover;">

          }

        </div>

        <!-- CARD BODY -->
        <div class="card-body d-flex flex-column">

          <h5 class="card-title">
            {{ p.title }}
          </h5>

          <p class="text-success fw-bold">
            $ {{ p.price }}
          </p>

          <p class="text-muted small">
            Stock: {{ p.stock }}
          </p>

          <button
            class="btn btn-outline-primary mt-auto"
            (click)="viewProduct(p.productId)">
            View Product
          </button>

        </div>

      </div>

    </div>

    }

  </div>

</div>
