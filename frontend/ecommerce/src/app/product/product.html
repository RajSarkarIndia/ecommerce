<h1 class="text-danger">PRODUCT COMPONENT ACTIVE</h1>

<div class="container mt-5">

  <!-- ADD PRODUCT -->
  <div class="card shadow mb-5">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Add Product</h4>
    </div>

    <div class="card-body">
      <form [formGroup]="addProductForm">

        <div class="row mb-3">
          <div class="col-md-6">
            <label>SKU</label>
            <input class="form-control" formControlName="sku">
          </div>

          <div class="col-md-6">
            <label>Title</label>
            <input class="form-control" formControlName="title">
          </div>
        </div>

        <div class="mb-3">
          <label>Description</label>
          <textarea class="form-control"
                    rows="3"
                    formControlName="description"></textarea>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <label>Price</label>
            <input type="number"
                   class="form-control"
                   formControlName="price">
          </div>

          <div class="col-md-4">
            <label>Stock</label>
            <input type="number"
                   class="form-control"
                   formControlName="stock">
          </div>

          <div class="col-md-4">
            <label>Status</label>
            <select class="form-select"
                    formControlName="status">

              @for (status of productStatuses; track status) {
              <option [ngValue]="status">
                {{ status }}
              </option>
              }

            </select>
          </div>
        </div>

        <!-- CATEGORY MULTI SELECT -->
        <div class="mb-3">
          <label>Categories</label>

          <select class="form-select"
                  formControlName="categories"
                  multiple>

            @for (cat of categoryOptions; track cat) {
            <option [ngValue]="cat">
              {{ cat }}
            </option>
            }

          </select>
        </div>

        <button type="button"
                class="btn btn-primary w-100"
                (click)="addProduct()">
          Add Product
        </button>

      </form>
    </div>
  </div>


  <!-- PRODUCT LIST -->
  <h4 class="mb-3">My Products</h4>

  <div class="row">

    @for (product of products; track product.productId) {

    <div class="col-md-4 mb-4">

      <div class="card h-100 shadow-sm">
        <div class="card-body">

          <h5>{{ product.title }}</h5>

          <p class="text-muted small">
            {{ product.description }}
          </p>

          <p><strong>Price:</strong> ₹{{ product.price }}</p>
          <p><strong>Stock:</strong> {{ product.stock }}</p>

          <!-- DISPLAY CATEGORIES -->
          <p>
            <strong>Categories:</strong>
            @for (cat of product.categories; track cat) {
            <span class="badge bg-secondary me-1">
                  {{ cat }}
                </span>
            }
          </p>

          <!-- STATUS -->
          <select class="form-select form-select-sm mb-3"
                  [(ngModel)]="product.status"
                  (ngModelChange)="updateStatus(product, $event)"
                  [ngModelOptions]="{ standalone: true }">

            @for (status of productStatuses; track status) {
            <option [ngValue]="status">
              {{ status }}
            </option>
            }

          </select>

          <button class="btn btn-danger btn-sm w-100 mb-3"
                  (click)="deleteProduct(product.productId)">
            Delete Product
          </button>

        </div>
      </div>

    </div>

    }

  </div>

</div>
