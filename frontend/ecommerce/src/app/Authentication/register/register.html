<div class="container d-flex justify-content-center align-items-center vh-100 bg-transparent bg-opacity-25">
  <div class="card shadow-lg p-4" style="width: 380px; border-radius: 12px;">

    <h3 class="text-center mb-4 text-success">Create Account</h3>

    <form [formGroup]="registerForm" (ngSubmit)="register()">

      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input
          type="text"
          class="form-control form-control-lg"
          formControlName="name"
          placeholder="Enter your full name"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input
          type="email"
          class="form-control form-control-lg"
          formControlName="email"
          placeholder="Enter your email"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input
          type="password"
          class="form-control form-control-lg"
          formControlName="password"
          placeholder="Create a password"
          required>
      </div>

      <button type="submit" class="btn btn-success w-100 btn-lg mt-2">
        Register
      </button>

      <p class="text-center mt-3 mb-0">
        Already have an account?
        <a routerLink="/login" class="text-decoration-none fw-semibold">Login</a>
      </p>

    </form>

  </div>
</div>
